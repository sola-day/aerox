# Runs on the self-hosted runner on the dev box (DEV_PLAN §1.4): the fast and
# services stages need the two Postgres databases; integration needs real
# hostnames. Stage names follow VERIFICATION §11.
name: ci
on:
  push:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MIX_ENV: test
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5433"
jobs:
  fast:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          echo "$HOME/.local/share/mise/shims:$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install
      - name: deps
        run: mix deps.get
      - name: compile (warnings are errors, boundary enforced)
        run: mix compile --warnings-as-errors
      - name: format
        run: mix format --check-formatted
      - name: credo
        run: mix credo --strict
      - name: golden corpus provenance
        run: mix aerox.golden.verify --upstream
      - name: kernel, contract and unit tests (L0–L5)
        run: mix test --exclude service --exclude integration
  services:
    runs-on: self-hosted
    needs: fast
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.local/share/mise/shims:$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mix deps.get
      - name: service suites (L6)
        run: mix test --only service
  integration:
    runs-on: self-hosted
    needs: services
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.local/share/mise/shims:$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mix deps.get
      - name: all-in-one scenarios via the Node harness (L7)
        run: mix test --only integration
  network:
    # VERIFICATION §11 "network": interop rows against the reference containers
    # and the in-process fault suite (§10.2). Nightly and on release branches.
    runs-on: self-hosted
    needs: services
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 60
    env:
      AEROX_PDS_URL: https://pds.aerox.sola.town
      AEROX_RELAY_URL: https://relay.aerox.sola.town
      AEROX_PLC_URL: https://plc.aerox.sola.town
      AEROX_REF_PDS_URL: https://ref-pds.aerox.sola.town
      AEROX_REF_RELAY_URL: https://ref-relay.aerox.sola.town
      AEROX_REF_PLC_URL: https://ref-plc.aerox.sola.town
      AEROX_REF_PDS_IDENTIFIER: refalice.ref-pds.aerox.sola.town
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.local/share/mise/shims:$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mix deps.get
      - name: reference containers
        run: docker compose -f tools/interop/compose.yaml up -d ref-plc ref-relay ref-pds
      - name: interop rows (§7.3)
        env:
          AEROX_REF_PDS_PASSWORD: ${{ secrets.AEROX_REF_PDS_PASSWORD }}
        run: mix test --only interop
      - name: process faults (§10.2)
        run: mix test test/pds/faults_test.exs
  release-config:
    # The production runtime config must evaluate with only the documented env
    # (ops/aerox.env.example) and must select a non-Local signer.
    runs-on: self-hosted
    needs: fast
    timeout-minutes: 10
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - run: echo "$HOME/.local/share/mise/shims:$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: mix deps.get --only prod && mix compile
      - name: evaluate config/runtime.exs
        env:
          SECRET_KEY_BASE: ci-only-not-a-secret-ci-only-not-a-secret-ci-only-not-a-secret-0000
          PHX_HOST: ci.example.com
          OAUTH_KEY_HEX: "00"
          JWT_SECRET: ci
          SIGNER_URL: https://signer.invalid
          SIGNER_SECRET: ci
          RELAY_ADMIN_PASSWORD: ci
          APPVIEW_SIGNING_KEY_HEX: "00"
          LABELER_ADMIN_PASSWORD: ci
        run: |
          mix run --no-start -e 'Aerox.Crypto.Signer.Local = Application.get_env(:aerox, Aerox.Crypto.Signer)[:adapter] && raise "Local signer in prod"; :prod = Application.get_env(:aerox, :env)'
