# Reference stacks for VERIFICATION §7.2 (interop) — the upstream oracles run
# as pinned containers next to the aerox dev stack. They share the aerox
# Postgres (compose.yaml at the repo root) through its compose network, one
# database per oracle, and are published on the multica bridge gateway so
# the box's Traefik can front them under ref-*.aerox.sola.town
# (ops/traefik/aerox.dynamic.yml).
#
#   docker compose -f tools/interop/compose.yaml up -d ref-plc ref-relay ref-pds
name: aerox-interop

services:
  # did-method-plc server built from the reading-room checkout at 1e301e5e:
  #   docker build -t aerox-ref-plc:1e301e5e -f packages/server/Dockerfile .   (in ../bsky/did-method-plc)
  ref-plc:
    image: aerox-ref-plc:1e301e5e
    environment:
      DB_CREDS_JSON: '{"username":"aerox","password":"aerox","host":"db","port":"5432","database":"ref_plc"}'
      DB_MIGRATE_CREDS_JSON: '{"username":"aerox","password":"aerox","host":"db","port":"5432","database":"ref_plc"}'
      ENABLE_MIGRATIONS: "true"
      PLC_VERSION: "1e301e5e"
      PORT: "3000"
      ADMIN_SECRET: REDACTED-ref-plc-admin-secret
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      DD_TRACE_ENABLED: "false"
    ports:
      - "172.18.0.1:2582:3000"
    networks:
      - aerox
    restart: unless-stopped

  # indigo relay built from the reading-room checkout at dfe5578f:
  #   docker build -f cmd/relay/Dockerfile -t aerox-ref-relay:dfe5578f .   (in ../bsky/indigo)
  # Sync v1.1 relay; RELAY_ALLOW_INSECURE_HOSTS lets it crawl plain-http dev
  # hosts, strict sync validation stays on so it is a real oracle for our PDS.
  ref-relay:
    image: aerox-ref-relay:dfe5578f
    environment:
      DATABASE_URL: postgres://aerox:aerox@db:5432/ref_relay
      RELAY_ADMIN_PASSWORD: REDACTED-ref-REDACTED-relay-admin-password-password
      RELAY_PLC_HOST: https://plc.aerox.sola.town
      RELAY_API_BIND: ":2470"
      RELAY_PERSIST_DIR: /data/relay
      RELAY_ALLOW_INSECURE_HOSTS: "true"
      RELAY_LENIENT_SYNC_VALIDATION: "false"
      RELAY_DEFAULT_ACCOUNT_LIMIT: "100"
      ENVIRONMENT: dev
    volumes:
      - ref-relay-data:/data/relay
    ports:
      - "172.18.0.1:2470:2470"
    networks:
      - aerox
    restart: unless-stopped

  # Upstream PDS distribution, pinned image tag. Secrets below are dev-only
  # throwaways generated with openssl (see bluesky-social/pds installer.sh).
  # Handles live under .ref-pds.aerox.sola.town; that is two labels below the
  # *.aerox.sola.town certificate, so they resolve via DNS TXT, not by hostname.
  ref-pds:
    image: ghcr.io/bluesky-social/pds:0.4
    environment:
      PDS_HOSTNAME: ref-pds.aerox.sola.town
      PDS_PORT: "3000"
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_BLOB_UPLOAD_LIMIT: "52428800"
      PDS_DID_PLC_URL: https://plc.aerox.sola.town
      PDS_JWT_SECRET: REDACTED-ref-pds-jwt-secret
      PDS_ADMIN_PASSWORD: REDACTED-ref-REDACTED-pds-admin-password-password
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: REDACTED-ref-pds-rotation-key
      PDS_SERVICE_HANDLE_DOMAINS: .ref-pds.aerox.sola.town
      PDS_CRAWLERS: https://relay.aerox.sola.town
      # The reference PDS proxies app.bsky.* to the reference AppView (§7.1
      # compares two whole stacks). PDS_BSKY_APP_VIEW_DID is the DID that
      # AppView minted for itself on first boot — it is the audience of the
      # service JWT, so it has to be the real one, not a did:web guess.
      PDS_BSKY_APP_VIEW_URL: https://ref-appview.aerox.sola.town
      PDS_BSKY_APP_VIEW_DID: ${REF_APPVIEW_DID:-did:web:ref-appview.aerox.sola.town}
      PDS_REPORT_SERVICE_URL: https://labeler.aerox.sola.town
      PDS_REPORT_SERVICE_DID: did:web:labeler.aerox.sola.town
      PDS_DEV_MODE: "true"
      LOG_ENABLED: "true"
    volumes:
      - ref-pds-data:/pds
    ports:
      - "172.18.0.1:2583:3000"
    networks:
      - aerox
    restart: unless-stopped

  # A second reference PDS registered with the reference PLC (did-method-plc)
  # instead of ours: the whole-bsky identity stack that aero's self-custody flow
  # (docs/SELF_CUSTODY.md §9) is tested against. Throwaway dev secrets. Nothing
  # crawls it; app.bsky.* goes to the reference AppView like ref-pds.
  ref-pds2:
    image: ghcr.io/bluesky-social/pds:0.4
    environment:
      PDS_HOSTNAME: ref-pds2.aerox.sola.town
      PDS_PORT: "3000"
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_DID_PLC_URL: https://ref-plc.aerox.sola.town
      PDS_JWT_SECRET: REDACTED-ref-pds2-jwt-secret
      PDS_ADMIN_PASSWORD: REDACTED-ref-pds2-admin-password
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: REDACTED-ref-pds2-rotation-key
      PDS_SERVICE_HANDLE_DOMAINS: .ref-pds2.aerox.sola.town
      PDS_INVITE_REQUIRED: "false"
      PDS_BSKY_APP_VIEW_URL: https://ref-appview.aerox.sola.town
      PDS_BSKY_APP_VIEW_DID: ${REF_APPVIEW_DID:-did:web:ref-appview.aerox.sola.town}
      PDS_DEV_MODE: "true"
      LOG_ENABLED: "true"
    volumes:
      - ref-pds2-data:/pds
    ports:
      - "172.18.0.1:2585:3000"
    networks:
      - aerox
    restart: unless-stopped

  # The bsky AppView of VERIFICATION §7.1, built from the reading-room checkout
  # at 62f944dd6 (upstream @atproto/bsky at 6a6fbc155 plus the standalone
  # entrypoint that runs the dataplane, a mock bsync, the AppView and the repo
  # subscription in one process):
  #   docker build -f services/bsky-standalone/Dockerfile -t aerox-ref-appview:62f944dd6 .   (in ../bsky/atproto)
  # It indexes the reference PDS, so the two stacks stay separate all the way
  # down and a parity diff compares two independent implementations of the same
  # scenario rather than one of them reading the other's index. On first boot it
  # registers a DID for itself on our PLC and writes it to its DATA_DIR. Bring
  # the pair up in that order, because the reference PDS needs that DID as the
  # audience of its service JWTs:
  #
  #   docker compose -f tools/interop/compose.yaml up -d ref-appview
  #   export REF_APPVIEW_DID=$(docker compose -f tools/interop/compose.yaml \
  #     exec -T ref-appview cat /home/node/data/server.did)
  #   docker compose -f tools/interop/compose.yaml up -d ref-pds
  ref-appview:
    image: aerox-ref-appview:62f944dd6
    environment:
      DB_POSTGRES_URL: postgres://aerox:aerox@db:5432/ref_appview
      DB_SCHEMA: public
      BSKY_DID_PLC_URL: https://plc.aerox.sola.town
      BSKY_PUBLIC_URL: https://ref-appview.aerox.sola.town
      BSKY_REPO_PROVIDER: wss://ref-pds.aerox.sola.town
      BSKY_PORT: "3000"
      # A named volume mounted at a path the image does not have is created
      # owned by root, and the image runs as `node`. /home/node exists and is
      # already the node user's, so the volume inherits that ownership.
      DATA_DIR: /home/node/data
      BSKY_ADMIN_PASSWORDS: REDACTED-ref-appview-admin-password
      LOG_ENABLED: "true"
      LOG_LEVEL: info
      DD_TRACE_ENABLED: "false"
    volumes:
      - ref-appview-data:/home/node/data
    ports:
      - "172.18.0.1:2584:3000"
    networks:
      - aerox
    restart: unless-stopped

volumes:
  ref-relay-data:
  ref-pds-data:
  ref-pds2-data:
  ref-appview-data:

networks:
  aerox:
    name: aerox_default
    external: true
