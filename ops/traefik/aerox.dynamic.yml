# Traefik dynamic configuration for aerox, spliced into the shared
# ginger-traefik dynamic.yml by ops/traefik/install.sh. See DEV_PLAN §1.2.
#
# `<dev-domain>` from DEV_PLAN §1.2 is `aerox.sola.town`: aerox gets its own
# subtree rather than the sola.town apex, because the apex already carries other
# apps (demo, registry, sonic) and a handle catch-all there would race their
# routers. Services live at pds./plc./relay./appview./labeler./jetstream.aerox.sola.town and
# handles at *.aerox.sola.town, exactly as the plan lays out.
#
# Traefik terminates TLS and forwards plain HTTP to the Phoenix dev server on the
# host. The upstream is the `multica` bridge gateway (172.18.0.1): reachable from
# the Traefik container, private to that bridge, and — unlike 0.0.0.0 — not
# published on the public interface, which matters because the box has no host
# firewall. Start the dev server with AEROX_BIND_IP=172.18.0.1 (see .envrc.example).
http:
  routers:
    # Owns the certificate request for the whole aerox subtree. A handle such as
    # alice.aerox.sola.town is one label deeper than *.sola.town, and a TLS
    # wildcard covers exactly one label, so the existing certificate cannot serve
    # it and a new one is required. DNS-01 is mandatory: HTTP-01 cannot answer a
    # wildcard challenge. `domains` is what keeps this to a single certificate —
    # without it Traefik would ask Let's Encrypt for one certificate per handle
    # it ever sees and burn the 50-per-week limit.
    #
    # DNS itself needs no new record: RFC 4592 wildcard synthesis makes the
    # existing *.sola.town A record answer for names at any depth below it, which
    # is verified — alice.aerox.sola.town already resolves to the host.
    aerox-dev-pds:
      rule: "Host(`pds.aerox.sola.town`) || Host(`plc.aerox.sola.town`) || Host(`relay.aerox.sola.town`) || Host(`appview.aerox.sola.town`) || Host(`labeler.aerox.sola.town`) || Host(`jetstream.aerox.sola.town`) || Host(`aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-dev-pds
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "aerox.sola.town"
            sans:
              - "*.aerox.sola.town"

    # Every handle resolves to the PDS, which answers /.well-known/atproto-did
    # for it. Explicit priority 1 keeps this catch-all below the named service
    # routers above; Traefik's default priority is rule length, which would not
    # reliably order a long regexp against a short Host(). No certResolver here:
    # the certificate obtained above is in Traefik's shared store and matched by
    # SNI, so adding a resolver would only risk per-handle issuance.
    aerox-dev-handles:
      rule: "HostRegexp(`^[a-zA-Z0-9-]+\\.aerox\\.sola\\.town$`)"
      entryPoints:
        - websecure
      priority: 1
      service: aerox-dev-pds
      tls: {}

    # The reference oracles of VERIFICATION §7.2 (tools/interop/compose.yaml),
    # published on the bridge gateway like the dev server, one router each so
    # interop tests reach them over real hostnames and TLS. Default priority
    # (rule length) keeps them above the handle catch-all.
    aerox-ref-plc:
      rule: "Host(`ref-plc.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-plc
      tls: {}
    aerox-ref-relay:
      rule: "Host(`ref-relay.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-relay
      tls: {}
    aerox-ref-pds:
      rule: "Host(`ref-pds.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-pds
      tls: {}
    aerox-ref-appview:
      rule: "Host(`ref-appview.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-appview
      tls: {}

    # The second reference PDS (tools/interop/compose.yaml ref-pds2), registered
    # with the reference PLC; aero's self-custody interop test signs in to it.
    aerox-ref-pds2:
      rule: "Host(`ref-pds2.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-pds2
      tls: {}

    # Handles on the reference PDS are `<name>.ref-pds.aerox.sola.town`, one
    # label deeper than the `*.aerox.sola.town` certificate reaches, so without
    # this the reference AppView cannot fetch `/.well-known/atproto-did` for any
    # of them and stores every one as `handle.invalid` — which then looks like a
    # difference in every endpoint that returns an actor. DNS needs nothing:
    # `*.sola.town` synthesises at any depth.
    aerox-ref-pds-handles:
      rule: "HostRegexp(`^[a-zA-Z0-9-]+\\.ref-pds\\.aerox\\.sola\\.town$`)"
      entryPoints:
        - websecure
      priority: 2
      service: aerox-ref-pds
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "ref-pds.aerox.sola.town"
            sans:
              - "*.ref-pds.aerox.sola.town"

    # The lab-network instance (tools/interop/lab-devserver.sh, VERIFICATION
    # §7.3): a second dev server on :4002 whose services and handles live under
    # lab.aerox.sola.town. Its own wildcard certificate, like ref-pds above.
    aerox-lab:
      rule: "Host(`lab.aerox.sola.town`) || HostRegexp(`^[a-zA-Z0-9-]+\\.lab\\.aerox\\.sola\\.town$`)"
      entryPoints:
        - websecure
      priority: 2
      service: aerox-lab
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "lab.aerox.sola.town"
            sans:
              - "*.lab.aerox.sola.town"

    # The migration target of aero-app's test/migrate.mjs
    # (tools/interop/mig-devserver.sh): a third dev server on :4003 sharing the
    # primary's PLC directory. Its own wildcard certificate, for its handles.
    aerox-mig:
      rule: "Host(`mig.aerox.sola.town`) || HostRegexp(`^[a-zA-Z0-9-]+\\.mig\\.aerox\\.sola\\.town$`)"
      entryPoints:
        - websecure
      priority: 2
      service: aerox-mig
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "mig.aerox.sola.town"
            sans:
              - "*.mig.aerox.sola.town"

    # ouranos (DEV_PLAN §1.2), the Next.js dev/standalone server on the bridge
    # gateway at :3000, pointed at pds.aerox.sola.town.
    aerox-ouranos:
      rule: "Host(`ouranos.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ouranos
      tls: {}

    # The rotation-key signing service of DESIGN §14.2, which by definition does
    # not run on the host it signs for: this box holds the key and the release
    # under drill on generic.dev calls in. `Signer.Remote` authenticates with a
    # bearer secret, but a signing oracle should not also be reachable by the
    # whole internet, so the allow-list pins it to that one host (both of its
    # addresses — its egress prefers IPv6).
    aerox-signer:
      rule: "Host(`signer.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-signer
      middlewares:
        - aerox-signer-allow
      tls: {}

    # bulletin (DESIGN §12.5 / VERIFICATION §6 scenario 9): the spaces demo app
    # on the bridge gateway at :3002, its managing-app DID is did:web:bulletin.aerox.sola.town.
    aerox-bulletin:
      rule: "Host(`bulletin.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-bulletin
      tls: {}

    # aero (the aero-app repo): the React social client, served as static files
    # by aero-app/server/serve.mjs on the bridge gateway at :3003. aero.sola.town
    # is one label below sola.town, so the shared *.sola.town certificate and the
    # *.sola.town DNS wildcard already cover it.
    aero-app:
      rule: "Host(`aero.sola.town`)"
      entryPoints:
        - websecure
      service: aero-app
      tls: {}

  middlewares:
    aerox-signer-allow:
      ipAllowList:
        sourceRange:
          - "51.159.210.79/32"
          - "2001:bc8:1201:601:2247:47ff:fe7f:8f92/128"

  services:
    aerox-mig:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:4003"
    aerox-lab:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:4002"
    aerox-ref-pds2:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2585"
    aero-app:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:3003"
    aerox-signer:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:4900"
    aerox-bulletin:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:3002"
    aerox-ouranos:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:3000"
    aerox-dev-pds:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:4000"
    aerox-ref-plc:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2582"
    aerox-ref-relay:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2470"
    aerox-ref-pds:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2583"
    aerox-ref-appview:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2584"
