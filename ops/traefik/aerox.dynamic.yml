# Traefik dynamic configuration for aerox, spliced into the shared
# ginger-traefik dynamic.yml by ops/traefik/install.sh. See DEV_PLAN §1.2.
#
# `<dev-domain>` from DEV_PLAN §1.2 is `aerox.sola.town`: aerox gets its own
# subtree rather than the sola.town apex, because the apex already carries other
# apps (demo, registry, sonic) and a handle catch-all there would race their
# routers. Services live at pds./plc./relay./appview./labeler.aerox.sola.town and
# handles at *.aerox.sola.town, exactly as the plan lays out.
#
# Traefik terminates TLS and forwards plain HTTP to the Phoenix dev server on the
# host. The upstream is the `multica` bridge gateway (172.18.0.1): reachable from
# the Traefik container, private to that bridge, and — unlike 0.0.0.0 — not
# published on the public interface, which matters because the box has no host
# firewall. Start the dev server with AEROX_BIND_IP=172.18.0.1 (see .envrc.example).
http:
  routers:
    # Owns the certificate request for the whole aerox subtree. A handle such as
    # alice.aerox.sola.town is one label deeper than *.sola.town, and a TLS
    # wildcard covers exactly one label, so the existing certificate cannot serve
    # it and a new one is required. DNS-01 is mandatory: HTTP-01 cannot answer a
    # wildcard challenge. `domains` is what keeps this to a single certificate —
    # without it Traefik would ask Let's Encrypt for one certificate per handle
    # it ever sees and burn the 50-per-week limit.
    #
    # DNS itself needs no new record: RFC 4592 wildcard synthesis makes the
    # existing *.sola.town A record answer for names at any depth below it, which
    # is verified — alice.aerox.sola.town already resolves to the host.
    aerox-dev-pds:
      rule: "Host(`pds.aerox.sola.town`) || Host(`plc.aerox.sola.town`) || Host(`relay.aerox.sola.town`) || Host(`appview.aerox.sola.town`) || Host(`labeler.aerox.sola.town`) || Host(`aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-dev-pds
      tls:
        certResolver: letsencrypt-dns
        domains:
          - main: "aerox.sola.town"
            sans:
              - "*.aerox.sola.town"

    # Every handle resolves to the PDS, which answers /.well-known/atproto-did
    # for it. Explicit priority 1 keeps this catch-all below the named service
    # routers above; Traefik's default priority is rule length, which would not
    # reliably order a long regexp against a short Host(). No certResolver here:
    # the certificate obtained above is in Traefik's shared store and matched by
    # SNI, so adding a resolver would only risk per-handle issuance.
    aerox-dev-handles:
      rule: "HostRegexp(`^[a-zA-Z0-9-]+\\.aerox\\.sola\\.town$`)"
      entryPoints:
        - websecure
      priority: 1
      service: aerox-dev-pds
      tls: {}

    # The reference oracles of VERIFICATION §7.2 (tools/interop/compose.yaml),
    # published on the bridge gateway like the dev server, one router each so
    # interop tests reach them over real hostnames and TLS. Default priority
    # (rule length) keeps them above the handle catch-all.
    aerox-ref-plc:
      rule: "Host(`ref-plc.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-plc
      tls: {}
    aerox-ref-relay:
      rule: "Host(`ref-relay.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-relay
      tls: {}
    aerox-ref-pds:
      rule: "Host(`ref-pds.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ref-pds
      tls: {}

    # ouranos (DEV_PLAN §1.2), the Next.js dev/standalone server on the bridge
    # gateway at :3000, pointed at pds.aerox.sola.town.
    aerox-ouranos:
      rule: "Host(`ouranos.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-ouranos
      tls: {}

    # bulletin (DESIGN §12.5 / VERIFICATION §6 scenario 9): the spaces demo app
    # on the bridge gateway at :3002, its managing-app DID is did:web:bulletin.aerox.sola.town.
    aerox-bulletin:
      rule: "Host(`bulletin.aerox.sola.town`)"
      entryPoints:
        - websecure
      service: aerox-bulletin
      tls: {}

  services:
    aerox-bulletin:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:3002"
    aerox-ouranos:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:3000"
    aerox-dev-pds:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:4000"
    aerox-ref-plc:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2582"
    aerox-ref-relay:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2470"
    aerox-ref-pds:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:2583"
